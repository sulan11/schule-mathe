<script>

ellen","t":"num","k":["gjcg5r"]},{"l":"Tor 2: h(x) = x^3 − 2x^2 − 15x. Kleinste Nullstelle","t":"num","k":["eipl2j"]},{"l":"Tor 3: k(x) = 2x^4 − 8x^3. Die von 0 verschiedene Nullstelle","t":"num","k":["1gw2p12"]},{"l":"Tor 4: m(x) = (x^2 + 4)(x^2 − 9)(x − 1). Anzahl der Nullstellen","t":"num","k":["1jy1h5q"]}],"h":["Satz vom Nullprodukt: Ein Produkt ist genau dann null, wenn mindestens ein Faktor null ist.","Tor 2 und 3: Klammern Sie die höchste Potenz von x aus, die in jedem Summanden steckt.","Tor 2: Nach dem Ausklammern bleibt eine quadratische Gleichung (pq-Formel). Tor 4: Untersuchen Sie jede Klammer einzeln. Kann x^2 + 4 null werden?"],"ggb":"Geben Sie g, h, k und m ein und nutzen Sie den Befehl Nullstelle(g)."},{"id":"s3","name":"Reaktorraum","ab":"AB I–II","story":"Der Notreaktor liefert keinen Strom. Seine Steuerung rechnet nur mit Linearfaktoren.","task":"<b>Bestimmen Sie</b> die fehlenden Zahlen.","f":[{"l":"(1) f(x) = a(x + 2)(x − 1)(x − 3) verläuft durch P(0 | 12). a =","t":"num","k":["1etv58h"]},{"l":"(2) q(x) = 3x^3 − 3x^2 − 18x = a · x · (x − b) · (x + c) mit b, c &gt; 0. a =","t":"num","k":["1cbvkhr"]},{"l":"b =","t":"num","k":["1a3vlg0"]},{"l":"c =","t":"num","k":["ab7pgm"]},{"l":"(3) r(x) = (x − 2)^2 · (x + 5). An welcher Nullstelle berührt der Graph die x-Achse, ohne sie zu schneiden? x =","t":"num","k":["d3s0hx"]},{"l":"An welcher Nullstelle wechselt r das Vorzeichen? x =","t":"num","k":["1c4xfg8"]}],"h":["(1) Der Punkt P liegt auf dem Graphen, also gilt f(0) = 12.","(2) Klammern Sie zuerst 3x aus und bestimmen Sie dann die Nullstellen der Klammer.","(3) Betrachten Sie die Vielfachheit: Ein Faktor mit geradem Exponenten wechselt sein Vorzeichen nicht."],"ggb":"f(x) = a(x+2)(x-1)(x-3) mit Ihrem a; q(x) in beiden Formen; r(x) = (x-2)^2 (x+5)"},{"id":"s4","name":"Druckkammer","ab":"AB I–III","story":"Der Druck steigt. Die Ventile reagieren nur auf Lösungen, die Sie durch Substitution finden.","task":"<b>Berechnen Sie</b> die Nullstellen und <b>gebe function plot(fn,o){const W=420,H=o.h||260,[a,b]=o.x,[c,d]=o.y;
 const X=x=>(x-a)/(b-a)*W,Y=y=>H-(y-c)/(d-c)*H;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label}">`;
 if(o.grid){for(let x=Math.ceil(a*2)/2;x<=b;x+=.5)s+=`<path d="M${X(x)} 0V${H}" stroke="${x%1?'#e8eef2':'#c8d6df'}"/>`;
  for(let y=Math.ceil(c*5)/5;y<=d;y+=.2){const v=Math.round(y*5)/5;s+=`<path d="M0 ${Y(v)}H${W}" stroke="${Number.isInteger(v)?'#c8d6df':'#eef2f5'}"/>`}}
 s+=`<path d="M0 ${Y(0)}H${W}M${X(0)} 0V${H}" stroke="#333" stroke-width="1.5"/>`;
 for(let x=Math.ceil(a);x<=b;x++)if(x)s+=`<text x="${X(x)}" y="${Y(0)+14}" font-size="12" text-anchor="middle">${x}</text><path d="M${X(x)} ${Y(0)-3}v6" stroke="#333"/>`;
 for(let y=Math.ceil(c);y<=d;y++)if(y)s+=`<text x="${X(0)-5}" y="${Y(y)+4}" font-size="12" text-anchor="end">${y}</text><path d="M${X(0)-3} ${Y(y)}h6" stroke="#333"/>`;
 let p='';for(let i=0;i<=600;i++){const x=a+(b-a)*i/600;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Math.max(-50,Math.min(H+50,Y(fn(x)))).toFixed(1)}
 return s+`<path d="${p}" fill="none" stroke="#0b57a4" stroke-width="3"/></svg>`}

function extra(k){
 if(k==='ICONS'){const P={A:'M10 60C35 20 55 55 90 10',B:'M10 10C30 90 45 20 55 45S75 80 90 10',C:'M10 10C35 55 60 15 90 60',D:'M10 60C25 -20 45 55 55 25S75 -10 90 60'};
  return '<div class="icons">'+Object.keys(P).map(n=>`<div>${n}<svg viewBox="0 0 100 70"><path d="${P[n]}" fill="none" stroke="#0b57a4" stroke-width="3"/></svg></div>`).join('')+'</div>'}
 if(k==='CHOICE'){const F=[x=>.25*(x+3)*(x+1)*(x-2)**2,x=>-.25*(x+3)**2*(x+1)*(x-2),x=>-.25*(x+3)*(x+1)*(x-2)**2,x=>-.25*(x-3)*(x-1)*(x+2)**2];
  return '<div class="graphs">'+F.map((f,i)=>`<div><b>Graph ${i+1}</b>${plot(f,{x:[-4,4],y:[-7,7],label:'Graph '+(i+1)})}</div>`).join('')+'</div>'}
 if(k==='EXTREMA')return '<div style="max-width:620px;margin:10px auto">'+plot(x=>(3*x**4-4*x**3-12*x*x)/5+2,{x:[-2.5,3.5],y:[-5,5],h:420,grid:true,label:'Graph von w'})+'<small>Gitter: waagerecht 0,5 · senkrecht 0,2</small></div>';
 return ''}

function header(){const count=S.filter(s=>G.done[s.id]).length;document.getElementById('progress-count').textContent=count+' / '+S.length;document.getElementById('bar').innerHTML=S.map((s,i)=>`<i title="${s.name}" class="${G.done[s.id]?'on':G.start&&G.cur===i?'current':''}"></i>`).join('');document.getElementById('route-list').innerHTML=S.map((s,i)=>{const done=G.done[s.id],current=G.start&&G.cur===i;return `<li class="${done?'done ':''}${current?'active':''}" ${current?'aria-current="step"':''} title="Station ${i+1}: ${s.name}${done?' – gelöst':''}"><span class="route-icon">${icon(s.id)}</span><div><small>STATION 0${i+1}</small>${s.name}</div><span class="route-state" aria-label="${done?'gelöst':current?'aktuell':'ausstehend'}">${done?'✓':current?'›':'·'}</span></li>`}).join('')}
function intro(){header();app.innerHTML=`<div class="card intro-card"><section class="hero"><div class="hero-copy"><div class="eyebrow">Notruf · Mission 01</div><h1>Notfall in 3 000 Metern Tiefe</h1>
<p>Sie gehören zur Crew der Forschungsstation <b>Abyssus</b>. Ein Seebeben hat die Station beschädigt, der Sauerstoff reicht noch <b>45 Minuten</b>. Die Bordcomputerin ARIA hat alle Schotten verriegelt. Sie öffnet sie nur für Menschen, die ganzrationale Funktionen beherrschen.</p>
</div>${heroArt}</section><section class="briefing"><div class="eyebrow">Missionsbriefing</div><p class="briefing-title"><b>Ganzrationale Funktionen</b></p><p>Kämpfen Sie sich zu zweit durch ${S.length} Stationen bis zur Rettungskapsel.</p>
<ul><li>Halten Sie Papier, Stift und Taschenrechner bereit.</li><li><b>GeoGebra nur zur Kontrolle</b>, nachdem eine Station gelöst ist.</li>
<li>Gestufte Hilfen werden erst nach und nach freigeschaltet (jeweils nach ${HILFE_SPERRE/60} Minuten).</li><li>Nach einer falschen Eingabe ist die Konsole ${FEHL_SPERRE} Sekunden gesperrt.</li><li>Wechseln Sie sich ab: Eine Person rechnet vor, die andere prüft.</li><li>Dezimalzahlen dürfen Sie mit Komma eingeben.</li></ul>
<div class="intro-actions"><button id="go" class="primary-start">Mission starten <span aria-hidden="true">→</span></button><small>2 Personen · 45 Minuten · 7 Stationen</small></div></section></div>`;
 document.getElementById('go').onclick=()=>{G.start=now();G.cur=0;save();show(S[0].id)}}

let active=null;
function show(id){active=id;header();const st=find(id),i=S.indexOf(st),done=G.done[id];
 if(G.wait[id]===undefined&&!done){G.wait[id]=now()+HILFE_SPERRE*1000;save()}
 const v=G.val[id]||[];
 let h=`<div class="card station-card"><div class="station-banner"><div><div class="eyebrow">${i>=0?'Sektor 0'+(i+1)+' / 07':'Zusatzrätsel'}${done?' · Gelöst':''}</div><h2>${i>=0?'Station '+(i+1)+': ':''}${st.name}<span class="ab">${st.ab}</span></h2></div><span class="station-emblem">${icon(st.id)}</span></div><div class="station-body"><p class="story">${st.story}</p><p class="task">${m(st.task)}</p>${extra(st.extra)}<div class="field-list">`;
 st.f.forEach((f,j)=>{const val=v[j]||'';h+=`<div class="row"><label for="f${j}">${m(f.l)}</label>`+(f.t==='sel'?`<select id="f${j}"><option value="">bitte wählen</option>${f.o.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f${j}" autocomplete="off" value="${val.replace(/"/g,'&quot;').replace(/</g,'&lt;')}">`)+'</div>'});
 h+='</div>';
 if(st.text)h+=`<p>${st.text.q}</p><textarea id="txt" placeholder="Ihre Begründung (mindestens ein vollständiger Satz)">${G.text.replace(/</g,'&lt;')}</textarea>`;
 h+=`<p class="action-row"><button id="chk">Code prüfen</button><span class="msg" id="msg" role="status"></span></p>`;
 if(done){h+=`<div class="ggb"><b>Gelöst! Kontrolle mit GeoGebra:</b> ${st.ggb}</div>`+(st.text?`<div class="ggb"><b>Vergleichen Sie Ihre Begründung:</b> ${st.text.m}</div>`:'')+`<p><button id="next">Weiter</button></p>`}
 h+=`</div></div><div class="card hint-card"><div class="hint-head"><div><h2>Unterstützung durch ARIA</h2><small>Gestufte Hilfen</small></div><button class="sec" id="hb"></button></div><div id="hl"></div></div>`;
 app.innerHTML=h;
 st.f.forEach((f,j)=>{const e=document.getElementById('f'+j);e.disabled=!!done;e.oninput=()=>{(G.val[id]=G.val[id]||[])[j]=e.value;save()}});
 const t=document.getElementById('txt');if(t){t.oninput=()=>{G.text=t.value;save()};t.disabled=!!done}
 document.getElementById('chk').onclick=()=>check(st);
 if(done){document.getElementById('chk').style.display='none';document.getElementById('next').onclick=()=>next(id)}
 document.getElementById('hb').onclick=()=>{G.hints[id]=(G.hints[id]||0)+1;G.wait[id]=now()+HILFE_SPERRE*1000;save();hints(st);tick()};
 hints(st);tick();window.scrollTo(0,0)}
function hints(st){document.getElementById('hl').innerHTML=st.h.slice(0,G.hints[st.id]||0).map((t,i)=>`<div class="hint"><b>Hilfe ${i+1}:</b> ${m(t)}</div>`).join('')}
function check(st){const id=st.id;if((G.lock[id]||0)>now())return;const msg=document.getElementById('msg');
 let right=0,empty=false;st.f.forEach((f,j)=>{const val=document.getElementById('f'+j).value;if(!val.trim())empty=true;if(f.k.includes(hash(id+j+canon(f.t,val))))right++});
 if(empty||(st.text&&G.text.trim().length<30)){msg.className='msg no';msg.textContent='Bitte füllen Sie zuerst alle Felder aus.';return}
 if(right===st.f.length){G.done[id]=true;if(S.every(s=>G.done[s.id])&&!G.end)G.end=now();save();show(id);document.querySelector('.ggb').scrollIntoView({block:'center'});return}
 G.fails++;G.lock[id]=now()+FEHL_SPERRE*1000;save();msg.className='msg no';msg.textContent=`Zugriff verweigert: ${right} von ${st.f.length} Feldern richtig.`;tick()}
function next(id){const i=S.findIndex(s=>s.id===id);if(i>=0&&i<S.length-1){G.cur=i+1;save();show(S[i+1].id)}else finale()}
function finale(){active=null;G.cur=S.length;save();header();
 const used=Object.values(G.hints).reduce((a,b)=>a+b,0),dur=Math.round((G.end-G.start)/1000);
 app.innerHTML=`<div class="card final-card"><div class="final-banner"><div><div class="eyebrow">Mission abgeschlossen</div><h1>🚀 Aufgetaucht!</h1><p>Die Rettungskapsel durchbricht die Wasseroberfläche. Mission erfüllt${dur<=SPIELZEIT?' – mit Sauerstoff in Reserve':' – auf den letzten Reserven'}.</p>
 </div><span class="station-emblem">${icon('s7')}</span></div><div class="final-body"><h2>Logbuch</h2><p class="logline">Zeit: ${mmss(dur)} min · genutzte Hilfen: ${used} · Fehlversuche: ${G.fails}</p><p><b>Ihre Begründung:</b> ${G.text.replace(/</g,'&lt;')}</p><p>Erstellen Sie einen Screenshot des Logbuchs.</p></div></div>
 <div class="card bonus-card"><h2>Zusatzrätsel für schnelle Teams</h2>${B.map(b=>`<p><button class="sec" data-b="${b.id}">${G.done[b.id]?'✔ ':''}${b.name} (${b.ab})</button></p>`).join('')}</div>
 <p class="reset-wrap"><button class="sec" id="rs">Neu starten</button></p>`;
 app.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>show(e.dataset.b));
 const r=document.getElementById('rs');let armed=false;r.onclick=()=>{if(!armed){armed=true;r.textContent='Wirklich alles löschen? Erneut tippen.';return}try{localStorage.removeItem(KEY)}catch(e){}G={start:0,cur:0,done:{},val:{},hints:{},wait:{},lock:{},fails:0,text:'',end:0};intro()}}
function tick(){const c=document.getElementById('clock');
 if(G.start){const left=SPIELZEIT-Math.floor(((G.end||now())-G.start)/1000);c.textContent=left>0?mmss(left):'Notreserve';c.style.color=left<300?'#ff9b7a':''}else c.textContent=mmss(SPIELZEIT);
 const remaining=G.start?Math.max(0,SPIELZEIT-Math.floor(((G.end||now())-G.start)/1000)):SPIELZEIT;document.getElementById('oxygen-fill').style.width=(100*remaining/SPIELZEIT)+'%';document.getElementById('oxygen').classList.toggle('low',remaining<300);
 if(!active)return;const st=find(active),hb=document.getElementById('hb'),chk=document.getElementById('chk');if(!hb)return;
 const n=G.hints[active]||0,w=Math.ceil(((G.wait[active]||0)-now())/1000);
 if(n>=st.h.length){hb.textContent='Alle Hilfen geöffnet';hb.disabled=true}
 else if(w>0&&!G.done[active]){hb.textContent=`🔒 Hilfe ${n+1} in ${mmss(w)}`;hb.disabled=true}else{hb.textContent=`💡 Hilfe ${n+1} öffnen`;hb.disabled=false}
 const l=Math.ceil(((G.lock[active]||0)-now())/1000);if(l>0){chk.disabled=true;chk.textContent=`Gesperrt (${l} s)`}else{chk.disabled=false;chk.textContent='Code prüfen'}}
document.getElementById('brand-icon').innerHTML=icon('brand');document.getElementById('aria-icon').innerHTML=icon('aria');
setInterval(tick,500);
if(!G.start)intro();else if(G.cur>=S.length)finale();else show(S[G.cur].id);
tick();
</script></body></html>
